<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LAB ESCAPE: CARRION UPDATE</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #fff; user-select: none; }
        #c { width: 100vw; height: 100vh; image-rendering: pixelated; filter: contrast(280%) grayscale(100%); }
        #ui { position: absolute; bottom: 20px; left: 20px; font-size: 16px; background: rgba(0,0,0,0.85); padding: 12px; border: 2px solid #fff; pointer-events: none; z-index: 999; }
        .danger { color: #f00; animation: blink 0.4s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="c"></canvas>
    
    <div id="ui">
        [A][D] — Бег / Сойти с лестницы | [W]/[S] — Лестницы<br>
        [ЛКМ] — Стрельба по мышке | [Зажать E] — Лечение на корточках<br>
        <hr>
        HP: <span id="h">100</span>% | КРОВОТЕЧЕНИЕ: <span id="b">0.0</span>/сек
        <div id="status"></div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const VW = 320; const VH = 180;
        canvas.width = VW; canvas.height = VH;

        let camY = 0; let mx = 0; let my = 0; let score = 0;

        const p = {
            x: 60, y: 40, vx: 0, vy: 0,
            hp: 100, bleed: 0, dead: false,
            isH: false, isL: false, t: 0,
            gunAngle: 0, crouchY: 0
        };

        // Параметры монстра из Carrion
        let carrionY = -120;
        const carrionSpeed = 0.09;
        const tentacles = [];
        for (let i = 0; i < 8; i++) {
            tentacles.push({ targetX: Math.random() * VW, currentX: Math.random() * VW, currentY: -120 });
        }

        const platforms = []; const ladders = []; const npcs = []; const bullets = [];
        const floorH = 110;

        function genFloor(idx) {
            const sy = idx * floorH + 90;
            if (idx % 2 === 0) {
                platforms.push({ x: 0, y: sy, w: 110, h: 6 }, { x: 170, y: sy, w: 150, h: 6 });
                ladders.push({ x: 130, y: sy, w: 14, h: floorH });
            } else {
                platforms.push({ x: 0, y: sy, w: 160, h: 6 }, { x: 230, y: sy, w: 90, h: 6 });
                ladders.push({ x: 185, y: sy, w: 14, h: floorH });
            }
            if (idx > 0) {
                npcs.push({ x: 240, y: sy - 18, w: 10, h: 18, dir: -1, lastS: 0, hp: 30, dead: false, t: 0 });
            }
        }

        for (let i = 0; i < 10; i++) genFloor(i);

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousemove', e => {
            const r = canvas.getBoundingClientRect();
            mx = ((e.clientX - r.left) / r.width) * VW;
            my = ((e.clientY - r.top) / r.height) * VH + camY;
        });
        window.addEventListener('mousedown', () => {
            if (!p.dead) {
                let pY = p.y + 4 + p.crouchY;
                let a = Math.atan2(my - pY, mx - p.x);
                bullets.push({ x: p.x + Math.cos(a) * 8, y: pY + Math.sin(a) * 8, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, type: 0 });
            }
        });

        function drawRG(x, y, t, isMoving, isDead, isCrouch, angle, type) {
            ctx.fillStyle = '#fff';
            let cY = isCrouch ? 4 : 0;
            if (isDead) {
                ctx.fillRect(x + 3, y + 10, 4, 4);
                ctx.fillRect(x - 2, y + 14, 8, 4);
                ctx.fillRect(x - 5, y + 16, 4, 2);
                ctx.fillRect(x + 1, y + 17, 6, 2);
                return;
            }
            ctx.fillRect(x + 3, y + cY, 4, 4);
            ctx.fillRect(x + 4, y + 4 + cY, 2, 1);
            ctx.fillRect(x + 2, y + 5 + cY, 6, 6);
            let wave = isMoving ? Math.sin(t * 0.25) * 3 : 0;
            if (type === 0) {
                ctx.save(); ctx.translate(x + 5, y + 7 + cY); ctx.rotate(angle);
                ctx.fillRect(0, -1, 6, 2); ctx.fillRect(4, 0, 2, 3); ctx.restore();
            } else {
                ctx.fillRect(x - 2, y + 7 + cY, 4, 2);
            }
            ctx.fillRect(x + 2, y + 11 + (wave > 0 ? 2 : 0), 2, 7 - cY);
            ctx.fillRect(x + 6, y + 11 + (wave < 0 ? 2 : 0), 2, 7 - cY);
        }
        function update() {
            if (p.y > (platforms.length / 2 - 4) * floorH) {
                genFloor(platforms.length / 2);
            }

            carrionY += carrionSpeed;
            if (p.y < carrionY + 10) { p.hp = 0; p.dead = true; }

            if (!p.dead) {
                p.t++; p.isH = keys['KeyE']; p.crouchY = p.isH ? 4 : 0;
                
                // Проверка нахождения внутри триггера лестницы
                let insideLadder = false;
                ladders.forEach(l => {
                    if (p.x + 5 > l.x && p.x < l.x + l.w && p.y + 18 > l.y && p.y < l.y + l.h) insideLadder = true;
                });

                // ФИКС: Если игрок жмет бег влево/вправо, сбрасываем режим лестницы и даем сойти на пол
                if (insideLadder && !keys['KeyA'] && !keys['KeyD'] && (keys['KeyW'] || keys['KeyS'])) {
                    p.isL = true;
                } else if (!insideLadder) {
                    p.isL = false;
                }

                if (p.isH) {
                    p.vx = 0; if (p.bleed > 0) p.bleed = Math.max(0, p.bleed - 0.04);
                } else if (p.isL) {
                    p.vx = 0; p.vy = 0;
                    if (keys['KeyW']) p.y -= 1.3;
                    if (keys['KeyS']) p.y += 1.3;
                } else {
                    if (keys['KeyA']) { p.vx = -1.6; }
                    else if (keys['KeyD']) { p.vx = 1.6; }
                    else p.vx = 0;
                    p.vy += 0.15; // Гравитация комплекса
                }

                p.x += p.vx; p.y += p.vy;

                platforms.forEach(plat => {
                    if (p.x + 8 > plat.x && p.x < plat.x + plat.w && p.y + 18 >= plat.y && p.y + 18 - p.vy <= plat.y + 6) {
                        p.y = plat.y - 18; p.vy = 0;
                        if (!keys['KeyW'] && !keys['KeyS']) p.isL = false; // На полу управление возвращается полностью
                    }
                });

                if (p.bleed > 0) p.hp -= p.bleed * 0.016;
                if (p.hp <= 0) { p.dead = true; }
                p.gunAngle = Math.atan2(my - (p.y + 7), mx - (p.x + 5));
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                if (b.type === 0) {
                    npcs.forEach(n => {
                        if (!n.dead && b.x > n.x && b.x < n.x + 10 && b.y > n.y && b.y < n.y + 18) {
                            n.hp -= 15; bullets.splice(i, 1);
                            if (n.hp <= 0) { n.dead = true; score += 100; }
                        }
                    });
                }
                if (b.y > p.y + 300 || b.y < p.y - 300) bullets.splice(i, 1);
            }

            npcs.forEach(n => {
                if (n.dead) return;
                n.t++; n.x += n.dir * 0.4; if (Math.random() < 0.01) n.dir *= -1;
                let dist = Math.abs(p.x - n.x);
                if (dist < 110 && Math.abs(p.y - n.y) < 15 && !p.dead) {
                    let now = Date.now();
                    if (now - n.lastS > 1400) {
                        let a = Math.atan2((p.y+8) - n.y, p.x - n.x);
                        bullets.push({ x: n.x, y: n.y + 7, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, type: 1 });
                        p.hp -= 10; p.bleed += 0.6; n.lastS = now;
                    }
                }
            });

            camY += (p.y - VH / 2 - camY) * 0.06;
            render();
            requestAnimationFrame(update);
        }

        function render() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
            ctx.save(); ctx.translate(0, -camY);

            let distToBM = p.y - carrionY;
            if (distToBM < 70 && !p.dead) ctx.translate((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2);

            ladders.forEach(l => {
                ctx.fillStyle = '#333'; ctx.fillRect(l.x, l.y, l.w, l.h);
                ctx.fillStyle = '#fff'; for (let sy = l.y; sy < l.y + l.h; sy += 5) ctx.fillRect(l.x, sy, l.w, 1);
            });

            ctx.fillStyle = '#fff'; platforms.forEach(plat => ctx.fillRect(plat.x, plat.y, plat.w, plat.h));
            bullets.forEach(b => { ctx.fillStyle = b.type === 0 ? '#fff' : '#aaa'; ctx.fillRect(b.x, b.y, 2, 2); });

            // Отрисовка Тела Монстра Carrion (Мрачная пульсирующая биомасса)
            ctx.fillStyle = '#111'; ctx.fillRect(0, -500, VW, carrionY + 500);
            ctx.fillStyle = '#fff';
            for (let i = 0; i < VW; i += 4) {
                let pulseY = carrionY + Math.sin(Date.now() * 0.006 + i) * 4 + Math.cos(Date.now() * 0.002 + i) * 2;
                ctx.fillRect(i, pulseY, 4, 3);
            }

            // Живая симуляция извивающихся щупалец Carrion
            tentacles.forEach((t, idx) => {
                if (Math.random() < 0.02) { // Щупальца цепляются за случайные точки платформ ниже
                    t.targetX = Math.random() * VW;
                }
                // Плавное шевеление и вытягивание к игроку
                t.currentX += (t.targetX - t.currentX) * 0.05;
                t.currentY = carrionY + 25 + Math.sin(Date.now() * 0.005 + idx) * 15;

                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(idx * (VW / 8) + 10, carrionY);
                // Рисуем изогнутое щупальце по синусоиде
                ctx.quadraticCurveTo(t.currentX, (carrionY + t.currentY)/2, t.currentX, t.currentY);
                ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.fillRect(t.currentX - 1.5, t.currentY - 1.5, 3, 3); // Кончик нароста
            });

            npcs.forEach(n => {
                drawRG(n.x, n.y, n.t, !n.dead, n.dead, false, 0, 1);
                if (!n.dead) {
                    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.moveTo(n.x+5, n.y+7);
                    ctx.lineTo(n.x+5+n.dir*80, n.y-10); ctx.lineTo(n.x+5+n.dir*80, n.y+20); ctx.fill();
                }
            });

            drawRG(p.x, p.y, p.t, p.vx !== 0, p.dead, p.isH, p.gunAngle, 0);
            ctx.restore();

            document.getElementById('h').innerText = Math.max(0, Math.ceil(p.hp));
            document.getElementById('b').innerText = p.bleed.toFixed(1);
            
            const st = document.getElementById('status');
            if (p.dead) st.innerHTML = '<span class="danger">БИОМАССА РАЗОРВАЛА ВАС НА ЧАСТИ. ОБНОВИТЕ СТРАНИЦУ (F5).</span>';
            else if (p.bleed > 0) st.innerHTML = '<span class="danger">РАНЕНИЕ ОТ ОХРАНЫ! ЗАЖМИТЕ [E] НА КОРТОЧКАХ!</span>';
            else if (distToBM < 70) st.innerHTML = '<span class="danger">ЩУПАЛЬЦА СВЕРХУ ЦЕПЛЯЮТСЯ ЗА СТЕНЫ! БЕГИТЕ ВНИЗ!</span>';
            else st.innerHTML = 'Глубина спуска стабильна. Очков: ' + score;
        }

        update();
    </script>
</body>
</html>
